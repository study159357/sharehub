<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .gradient-text { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    input, select, textarea { color: #ffffff !important; }
    input::placeholder, textarea::placeholder { color: #9ca3af !important; }
    .text-gray-500 { color: #9ca3af !important; }
    .text-gray-400 { color: #d1d5db !important; }
    .text-gray-600 { color: #d1d5db !important; }

</head>
<body class="min-h-screen" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);">

  <!-- 提示消息 -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ==================== 默认配置 ====================
    const DEFAULT_CONFIG = {
      url: 'https://jkwfychngpbtssolzrkt.supabase.co',
      key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imprd2Z5Y2huZ3BidHNzb2x6cmt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MjAyNjEsImV4cCI6MjA5NTE5NjI2MX0.-ZXQ-QQ9mCrPdtDIjnhU9UllyVbaP6VS09E0DCM7Mwk',
      bucket: 'shared-files',
      adminPassword: 'admin123'
    };
    // ==================== 配置结束 ====================

    const CONFIG_KEY = 'sharehub_config';
    const MAX_FILE_SIZE = 100 * 1024 * 1024;
    let CONFIG = { ...DEFAULT_CONFIG };
    let sb, bucket, isAdmin = false;
    let files = [], viewMode = 'grid', category = 'all', search = '', sort = 'newest', currentFile;
    
    // 上传相关
    let selectedFile = null;

    const $ = id => document.getElementById(id);
    const $$ = sel => document.querySelectorAll(sel);

    function loadConfig() {
      try {
        const stored = localStorage.getItem(CONFIG_KEY);
        if (stored) CONFIG = { ...DEFAULT_CONFIG, ...JSON.parse(stored) };
      } catch (e) {
        CONFIG = { ...DEFAULT_CONFIG };
      }
    }

    function saveConfig(newConfig) {
      CONFIG = { ...CONFIG, ...newConfig };
      localStorage.setItem(CONFIG_KEY, JSON.stringify(CONFIG));
      sb = supabase.createClient(CONFIG.url, CONFIG.key);
      bucket = CONFIG.bucket;
    }

    function init() {
      loadConfig();
      sb = supabase.createClient(CONFIG.url, CONFIG.key);
      bucket = CONFIG.bucket;
      bindEvents();
      $('mainApp').classList.remove('hidden');
      loadFiles();
    }

    function formatSize(b) { 
      if (!b) return '0 B'; 
      const k = 1024, s = ['B','KB','MB','GB']; 
      const i = Math.floor(Math.log(b) / Math.log(k)); 
      return parseFloat((b / Math.pow(k, i)).toFixed(1)) + ' ' + s[i]; 
    }
    function formatDate(d) { 
      return new Date(d).toLocaleDateString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); 
    }
    function getCat(t) { 
      if (t.startsWith('image/')) return 'image'; 
      if (t.startsWith('video/')) return 'video'; 
      if (t.startsWith('audio/')) return 'audio'; 
      if (/pdf|word|document|sheet|presentation|text/.test(t)) return 'document'; 
      return 'other'; 
    }
    function getCatLabel(c) { 
      return { image: '图片', video: '视频', audio: '音频', document: '文档', other: '其他' }[c] || '文件'; 
    }
    function getIcon(t) { 
      if (t.startsWith('image/')) return 'fa-image'; 
      if (t.startsWith('video/')) return 'fa-video'; 
      if (t.startsWith('audio/')) return 'fa-music'; 
      if (t.includes('pdf')) return 'fa-file-pdf'; 
      if (/word|document/.test(t)) return 'fa-file-word'; 
      if (/sheet|excel/.test(t)) return 'fa-file-excel'; 
      if (/zip|rar/.test(t)) return 'fa-file-zipper'; 
      if (/text|javascript|css|html|json/.test(t)) return 'fa-file-code'; 
      return 'fa-file'; 
    }

    function toast(msg, type = 'info') {
      const c = { success: 'fa-check-circle text-green-400', error: 'fa-circle-xmark text-red-400', info: 'fa-circle-info text-purple-400' };
      const t = document.createElement('div');
      t.className = `bg-gray-900 border border-white/20 rounded-xl px-4 py-3 flex items-center gap-3 shadow-xl fade-in`;
      t.innerHTML = `<i class="fa-solid ${c[type]}"></i><span class="text-sm text-white">${msg}</span>`;
      $('toastContainer').appendChild(t);
      setTimeout(() => t.remove(), 4000);
    }

    async function loadFiles() {
      $('loadingState').classList.remove('hidden');
      $('emptyState').classList.add('hidden');
      const { data, error } = await sb.from('files').select('*').order('created_at', { ascending: false });
      if (error) { 
        toast('连接失败: ' + error.message, 'error'); 
        $('loadingState').classList.add('hidden'); 
        return; 
      }
      files = data || [];
      $('loadingState').classList.add('hidden');
      updateStats();
      renderFiles();
      renderAdminFileList();
    }

    function updateStats() {
      const s = files.reduce((a, f) => a + (f.size || 0), 0);
      const d = files.reduce((a, f) => a + (f.download_count || 0), 0);
      const v = files.reduce((a, f) => a + (f.preview_count || 0), 0);
      $('statFiles').textContent = files.length;
      $('statSize').textContent = formatSize(s);
      $('statDownloads').textContent = d;
      $('statViews').textContent = v;
    }

    function renderFiles() {
      let list = [...files];
      if (category !== 'all') list = list.filter(f => (f.category || getCat(f.type)) === category);
      if (search) list = list.filter(f => f.name.toLowerCase().includes(search.toLowerCase()));
      if (sort === 'name') list.sort((a, b) => a.name.localeCompare(b.name));
      else if (sort === 'size') list.sort((a, b) => b.size - a.size);
      else if (sort === 'downloads') list.sort((a, b) => (b.download_count || 0) - (a.download_count || 0));
      else list.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      
      if (!list.length) { $('emptyState').classList.remove('hidden'); $('fileGrid').innerHTML = ''; $('fileList').innerHTML = ''; return; }
      $('emptyState').classList.add('hidden');
      
      if (viewMode === 'grid') {
        $('fileGrid').classList.remove('hidden');
        $('fileList').classList.add('hidden');
        $('fileGrid').innerHTML = list.map(f => renderCard(f)).join('');
        loadThumbs(list);
      } else {
        $('fileGrid').classList.add('hidden');
        $('fileList').classList.remove('hidden');
        $('fileList').innerHTML = list.map(f => renderRow(f)).join('');
      }
    }

    function renderCard(f) {
      const c = f.category || getCat(f.type);
      const previewable = ['image', 'video', 'audio', 'document'].includes(c);
      const uploaderInfo = f.uploader ? `<div class="text-xs text-gray-500"><i class="fa-solid fa-user mr-1"></i>${f.uploader}</div>` : '';
      const deleteBtn = isAdmin ? `<button class="del-btn absolute top-2 right-2 px-2 py-1 bg-red-500/50 rounded text-xs text-white hover:bg-red-600 transition opacity-0 group-hover:opacity-100"><i class="fa-solid fa-trash"></i></button>` : '';
      
      return `<div class="glass rounded-xl overflow-hidden hover:border-purple-500/50 transition group" data-id="${f.id}">
        <div class="relative aspect-video bg-black/30 flex items-center justify-center">
          ${f.type.startsWith('image/') 
            ? `<img src="" data-src="${f.storage_path}" class="w-full h-full object-cover">` 
            : `<i class="fa-solid ${getIcon(f.type)} text-4xl text-gray-400"></i>`}
          <span class="absolute top-2 left-2 px-2 py-0.5 bg-black/60 rounded text-xs text-white">${getCatLabel(c)}</span>
          ${deleteBtn}
        </div>
        <div class="p-4">
          <div class="text-sm text-white truncate mb-1" title="${f.name}">${f.name}</div>
          ${uploaderInfo}
          <div class="flex items-center gap-3 text-xs text-gray-400 mb-3 mt-1">
            <span>${formatSize(f.size)}</span>
            <span><i class="fa-solid fa-download text-blue-400"></i> ${f.download_count || 0}</span>
          </div>
          <div class="flex gap-2">
            <button class="dl-btn flex-1 py-2 bg-white/10 rounded-lg text-sm text-white hover:bg-white/20 transition"><i class="fa-solid fa-download mr-1"></i>下载</button>
            ${previewable ? `<button class="pv-btn flex-1 py-2 bg-purple-600/30 rounded-lg text-sm text-purple-300 hover:bg-purple-600/50 transition"><i class="fa-solid fa-eye mr-1"></i>预览</button>` : ''}
          </div>
        </div>
      </div>`;
    }

    function renderRow(f) {
      const c = f.category || getCat(f.type);
      const previewable = ['image', 'video', 'audio', 'document'].includes(c);
      const uploaderInfo = f.uploader ? `<span class="text-gray-500"><i class="fa-solid fa-user mr-1"></i>${f.uploader}</span>` : '';
      const deleteBtn = isAdmin ? `<button class="del-btn px-3 py-2 bg-red-500/30 rounded-lg hover:bg-red-500/50"><i class="fa-solid fa-trash text-red-400 text-sm"></i></button>` : '';
      
      return `<div class="glass rounded-lg p-3 flex items-center gap-4" data-id="${f.id}">
        <div class="w-12 h-12 bg-black/30 rounded-lg flex items-center justify-center flex-shrink-0">
          ${f.type.startsWith('image/') 
            ? `<img src="" data-src="${f.storage_path}" class="w-full h-full object-cover rounded">` 
            : `<i class="fa-solid ${getIcon(f.type)} text-lg text-gray-400"></i>`}
        </div>
        <div class="flex-1 min-w-0">
          <div class="text-sm text-white truncate">${f.name}</div>
          <div class="text-xs text-gray-400 mt-1">${getCatLabel(c)} · ${formatSize(f.size)} · ${formatDate(f.created_at)}</div>
          ${uploaderInfo ? `<div class="text-xs text-gray-500 mt-0.5">${uploaderInfo}</div>` : ''}
        </div>
        <div class="flex gap-2">
          <button class="dl-btn px-3 py-2 bg-white/10 rounded-lg hover:bg-white/20"><i class="fa-solid fa-download text-sm text-white"></i></button>
          ${previewable ? `<button class="pv-btn px-3 py-2 bg-purple-600/30 rounded-lg hover:bg-purple-600/50"><i class="fa-solid fa-eye text-purple-300 text-sm"></i></button>` : ''}
          ${deleteBtn}
        </div>
      </div>`;
    }

    function renderAdminFileList() {
      $('adminFileCount').textContent = `${files.length} 个文件`;
      $('adminFileList').innerHTML = files.map(f => `
        <div class="glass rounded-lg p-3 flex items-center gap-3" data-id="${f.id}">
          <i class="fa-solid ${getIcon(f.type)} text-gray-400"></i>
          <div class="flex-1 min-w-0">
            <div class="text-sm text-white truncate">${f.name}</div>
            <div class="text-xs text-gray-400">${formatSize(f.size)} · ${formatDate(f.created_at)} ${f.uploader ? '· ' + f.uploader : ''}</div>
          </div>
          <button class="admin-del-btn px-3 py-1.5 bg-red-500/30 rounded text-xs text-red-400 hover:bg-red-500/50 transition">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      `).join('');
    }

    function loadThumbs(list) {
      document.querySelectorAll('[data-src]').forEach(img => {
        const card = img.closest('[data-id]');
        const f = list.find(x => x.id === card?.dataset.id);
        if (f) img.src = sb.storage.from(bucket).getPublicUrl(f.storage_path).data.publicUrl;
      });
    }

    async function download(f) {
      const { data, error } = await sb.storage.from(bucket).download(f.storage_path);
      if (error) { toast('下载失败', 'error'); return; }
      const url = URL.createObjectURL(data);
      const a = document.createElement('a');
      a.href = url; a.download = f.name; a.click();
      URL.revokeObjectURL(url);
      await sb.from('files').update({ download_count: (f.download_count || 0) + 1 }).eq('id', f.id);
      f.download_count = (f.download_count || 0) + 1;
      updateStats(); renderFiles();
    }

    async function preview(f) {
      currentFile = f;
      $('previewModal').classList.remove('hidden');
      $('previewName').textContent = f.name;
      $('deletePreview').classList.toggle('hidden', !isAdmin);
      
      // 显示上传者
      if (f.uploader) {
        $('previewUploader').classList.remove('hidden');
        $('previewUploader').querySelector('span').textContent = f.uploader;
      } else {
        $('previewUploader').classList.add('hidden');
      }
      
      const url = sb.storage.from(bucket).getPublicUrl(f.storage_path).data.publicUrl;
      await sb.from('files').update({ preview_count: (f.preview_count || 0) + 1 }).eq('id', f.id);
      f.preview_count = (f.preview_count || 0) + 1;
      updateStats(); renderFiles();
      
      const c = f.category || getCat(f.type);
      const content = $('previewContent');
      
      if (c === 'image') content.innerHTML = `<img src="${url}" class="max-w-full max-h-full object-contain rounded-lg">`;
      else if (c === 'video') content.innerHTML = `<video controls autoplay class="max-w-full max-h-full rounded-lg"><source src="${url}" type="${f.type}"></video>`;
      else if (c === 'audio') content.innerHTML = `<div class="text-center"><div class="w-24 h-24 bg-purple-500/20 rounded-full mx-auto mb-6 flex items-center justify-center"><i class="fa-solid fa-music text-4xl text-purple-400"></i></div><audio controls autoplay class="w-80"><source src="${url}" type="${f.type}"></audio></div>`;
      else if (c === 'document' && f.type.includes('pdf')) content.innerHTML = `<iframe src="${url}" class="w-full h-[80vh] rounded-lg"></iframe>`;
      else content.innerHTML = `<div class="text-center"><i class="fa-solid ${getIcon(f.type)} text-6xl text-gray-400 mb-4"></i><p class="text-gray-400 mb-4">不支持预览</p><a href="${url}" download="${f.name}" class="px-6 py-3 bg-purple-600 rounded-lg text-white hover:bg-purple-700 transition"><i class="fa-solid fa-download mr-2"></i>下载查看</a></div>`;
    }

    async function deleteFile(f) {
      if (!confirm(`确定删除 "${f.name}" 吗？\n\n此操作不可恢复！`)) return;
      
      // 先删除数据库记录
      const { error: dErr } = await sb.from('files').delete().eq('id', f.id);
      if (dErr) { 
        toast('删除记录失败: ' + dErr.message, 'error'); 
        return; 
      }
      
      // 再删除存储文件
      const { error: sErr } = await sb.storage.from(bucket).remove([f.storage_path]);
      if (sErr) { 
        // 数据库已删除，存储文件删除失败，给个警告
        toast('记录已删除，但存储文件删除失败', 'info'); 
      } else {
        toast('已删除', 'success');
      }
      
      files = files.filter(x => x.id !== f.id);
      updateStats(); 
      renderFiles(); 
      renderAdminFileList();
      $('previewModal').classList.add('hidden');
    }

    // 选择文件
    function selectFile(file) {
      selectedFile = file;
      $('selectedFileName').textContent = file.name;
      $('selectedFileSize').textContent = formatSize(file.size);
      $('selectedFileIcon').className = `fa-solid ${getIcon(file.type)} text-purple-400 text-xl`;
      $('customFileName').value = file.name;
      $('uploaderName').value = '';
      $('uploadZone').classList.add('hidden');
      $('fileInfoArea').classList.remove('hidden');
    }

    // 清除选择
    function clearFileSelection() {
      selectedFile = null;
      $('fileInput').value = '';
      $('uploadZone').classList.remove('hidden');
      $('fileInfoArea').classList.add('hidden');
    }

    // 上传文件
    async function uploadFile() {
      if (!selectedFile) {
        toast('请先选择文件', 'error');
        return;
      }
      
      const uploader = $('uploaderName').value.trim();
      if (!uploader) {
        toast('请输入上传者名称', 'error');
        $('uploaderName').focus();
        return;
      }
      
      let fileName = $('customFileName').value.trim() || selectedFile.name;
      if (selectedFile.size > MAX_FILE_SIZE) { toast(`${fileName} 超过100MB`, 'error'); return; }
      
      const id = `up-${Date.now()}`;
      const item = document.createElement('div');
      item.id = id;
      item.className = 'bg-black/30 rounded-lg p-3 flex items-center gap-3';
      item.innerHTML = `<div class="w-10 h-10 bg-white/10 rounded-lg flex items-center justify-center"><i class="fa-solid ${getIcon(selectedFile.type)} text-gray-400"></i></div><div class="flex-1"><div class="text-sm text-white truncate">${fileName}</div><div class="text-xs text-gray-400">${formatSize(selectedFile.size)}</div><div class="h-1 bg-white/10 rounded mt-2"><div class="h-full bg-purple-500 rounded transition-all" style="width:0%"></div></div></div><div class="status text-sm font-medium text-gray-400">等待</div>`;
      $('uploadQueue').appendChild(item);
      $('uploadQueue').classList.remove('hidden');
      $('fileInfoArea').classList.add('hidden');
      
      const setS = (s, c) => { const el = item.querySelector('.status'); el.textContent = s; el.className = `status text-sm font-medium ${c}`; };
      
      setS('上传中', 'text-purple-400');
      
      const ext = fileName.split('.').pop();
      const path = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
      
      const xhr = new XMLHttpRequest();
      xhr.upload.addEventListener('progress', e => { if (e.lengthComputable) item.querySelector('.bg-purple-500').style.width = `${Math.round(e.loaded / e.total * 100)}%`; });
      
      xhr.addEventListener('load', async () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          setS('保存', 'text-purple-400');
          const { data: newFile, error } = await sb.from('files').insert({ 
            name: fileName, 
            type: selectedFile.type, 
            size: selectedFile.size, 
            storage_path: path, 
            download_count: 0, 
            preview_count: 0, 
            category: getCat(selectedFile.type),
            uploader: uploader
          }).select().single();
          
          if (error) {
            setS('失败', 'text-red-400');
            toast('保存失败', 'error');
          } else {
            setS('完成', 'text-green-400');
            files.unshift(newFile);
            updateStats();
            renderFiles();
            renderAdminFileList();
            toast(`${fileName} 上传成功`, 'success');
            setTimeout(() => {
              item.remove();
              if ($('uploadQueue').children.length === 0) {
                $('uploadQueue').classList.add('hidden');
                clearFileSelection();
              }
            }, 2000);
          }
        } else {
          setS('失败', 'text-red-400');
          toast('上传失败', 'error');
        }
      });
      
      xhr.addEventListener('error', () => { setS('失败', 'text-red-400'); toast('网络错误', 'error'); });
      xhr.open('POST', `${sb.supabaseUrl}/storage/v1/object/${bucket}/${path}`);
      xhr.setRequestHeader('apikey', sb.supabaseKey);
      xhr.setRequestHeader('Authorization', `Bearer ${sb.supabaseKey}`);
      xhr.send(selectedFile);
    }

    function bindEvents() {
      $$('.tab-btn').forEach(b => b.addEventListener('click', () => {
        $$('.tab-btn').forEach(t => { t.classList.remove('bg-purple-600', 'text-white'); t.classList.add('text-gray-300'); });
        b.classList.add('bg-purple-600', 'text-white');
        b.classList.remove('text-gray-300');
        category = b.dataset.cat;
        renderFiles();
      }));
      
      $('searchInput').addEventListener('input', e => { search = e.target.value; renderFiles(); });
      $('sortSelect').addEventListener('change', e => { sort = e.target.value; renderFiles(); });
      
      $('gridView').addEventListener('click', () => {
        viewMode = 'grid';
        $('gridView').classList.add('bg-purple-600', 'text-white');
        $('gridView').classList.remove('text-gray-400');
        $('listView').classList.remove('bg-purple-600', 'text-white');
        $('listView').classList.add('text-gray-400');
        renderFiles();
      });
      
      $('listView').addEventListener('click', () => {
        viewMode = 'list';
        $('listView').classList.add('bg-purple-600', 'text-white');
        $('listView').classList.remove('text-gray-400');
        $('gridView').classList.remove('bg-purple-600', 'text-white');
        $('gridView').classList.add('text-gray-400');
        renderFiles();
      });
      
      // 上传弹窗
      $('uploadBtn').addEventListener('click', () => { 
        $('uploadModal').classList.remove('hidden'); 
        clearFileSelection();
        $('uploadQueue').classList.add('hidden');
        $('uploadQueue').innerHTML = '';
      });
      $('closeUpload').addEventListener('click', () => { 
        $('uploadModal').classList.add('hidden'); 
      });
      $('uploadZone').addEventListener('click', () => $('fileInput').click());
      $('uploadZone').addEventListener('dragover', e => { e.preventDefault(); $('uploadZone').classList.add('border-purple-500'); });
      $('uploadZone').addEventListener('dragleave', () => $('uploadZone').classList.remove('border-purple-500'));
      $('uploadZone').addEventListener('drop', e => {
        e.preventDefault();
        $('uploadZone').classList.remove('border-purple-500');
        if (e.dataTransfer.files.length > 0) {
          selectFile(e.dataTransfer.files[0]);
        }
      });
      $('fileInput').addEventListener('change', e => {
        if (e.target.files.length > 0) {
          selectFile(e.target.files[0]);
        }
      });
      
      // 清除选择
      $('clearFile').addEventListener('click', clearFileSelection);
      
      // 确认上传
      $('confirmUpload').addEventListener('click', uploadFile);
      
      // 预览
      $('closePreview').addEventListener('click', () => { $('previewModal').classList.add('hidden'); $('previewContent').innerHTML = ''; });
      $('downloadPreview').addEventListener('click', () => { if (currentFile) download(currentFile); });
      $('deletePreview').addEventListener('click', () => { if (currentFile) deleteFile(currentFile); });
      
      // 管理员
      $('adminBtn').addEventListener('click', () => {
        if (isAdmin) {
          openAdminPanel();
        } else {
          $('adminLoginModal').classList.remove('hidden');
          $('adminPassword').value = '';
          $('adminPassword').focus();
          $('loginError').classList.add('hidden');
        }
      });
      
      $('doAdminLogin').addEventListener('click', () => {
        const pass = $('adminPassword').value;
        if (pass === CONFIG.adminPassword) {
          isAdmin = true;
          $('adminLoginModal').classList.add('hidden');
          openAdminPanel();
        } else {
          $('loginError').classList.remove('hidden');
          $('adminPassword').value = '';
        }
      });
      
      $('adminPassword').addEventListener('keydown', e => { 
        if (e.key === 'Enter') $('doAdminLogin').click(); 
      });
      
      $('closeAdminPanel').addEventListener('click', () => { $('adminPanelModal').classList.add('hidden'); });
      
      $('logoutBtn').addEventListener('click', () => {
        isAdmin = false;
        $('adminPanelModal').classList.add('hidden');
        toast('已退出管理', 'info');
        renderFiles();
      });
      
      $$('.admin-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          $$('.admin-tab').forEach(t => { t.classList.remove('active', 'text-white', 'border-purple-500'); t.classList.add('text-gray-400', 'border-transparent'); });
          tab.classList.add('active', 'text-white', 'border-purple-500');
          tab.classList.remove('text-gray-400', 'border-transparent');
          
          const tabName = tab.dataset.tab;
          $('adminFilesTab').classList.toggle('hidden', tabName !== 'files');
          $('adminConfigTab').classList.toggle('hidden', tabName !== 'config');
          
          if (tabName === 'config') {
            $('cfgUrl').value = CONFIG.url;
            $('cfgKey').value = CONFIG.key;
            $('cfgBucket').value = CONFIG.bucket;
            $('cfgAdminPass').value = '';
          }
        });
      });
      
      $('saveConfigBtn').addEventListener('click', () => {
        const url = $('cfgUrl').value.trim();
        const key = $('cfgKey').value.trim();
        const b = $('cfgBucket').value.trim();
        const pass = $('cfgAdminPass').value.trim();
        
        if (!url || !key) {
          toast('请填写完整', 'error');
          return;
        }
        
        const newConfig = { url, key, bucket: b };
        if (pass) newConfig.adminPassword = pass;
        
        saveConfig(newConfig);
        toast('配置已保存', 'success');
        loadFiles();
      });
      
      // 点击事件
      document.addEventListener('click', e => {
        const dl = e.target.closest('.dl-btn'), pv = e.target.closest('.pv-btn'), del = e.target.closest('.del-btn'), adminDel = e.target.closest('.admin-del-btn');
        const c = e.target.closest('[data-id]');
        
        if (dl) { const f = files.find(x => x.id === c?.dataset.id); if (f) download(f); }
        if (pv) { const f = files.find(x => x.id === c?.dataset.id); if (f) preview(f); }
        if (del && isAdmin) { const f = files.find(x => x.id === c?.dataset.id); if (f) deleteFile(f); }
        if (adminDel && isAdmin) { 
          const id = adminDel.closest('[data-id]')?.dataset.id;
          const f = files.find(x => x.id === id);
          if (f) deleteFile(f);
        }
      });
      
      document.addEventListener('keydown', e => { 
        if (e.key === 'Escape') { 
          $('uploadModal').classList.add('hidden'); 
          $('previewModal').classList.add('hidden'); 
          $('adminLoginModal').classList.add('hidden'); 
          $('adminPanelModal').classList.add('hidden'); 
        } 
      });
    }

    function openAdminPanel() {
      $('adminPanelModal').classList.remove('hidden');
      renderAdminFileList();
      $$('.admin-tab').forEach(t => { t.classList.remove('active', 'text-white', 'border-purple-500'); t.classList.add('text-gray-400', 'border-transparent'); });
      const filesTab = document.querySelector('[data-tab="files"]');
      filesTab.classList.add('active', 'text-white', 'border-purple-500');
      filesTab.classList.remove('text-gray-400', 'border-transparent');
      $('adminFilesTab').classList.remove('hidden');
      $('adminConfigTab').classList.add('hidden');
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
